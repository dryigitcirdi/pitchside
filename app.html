<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pitchside — Panel</title>
  <meta name="theme-color" content="#f6f6f4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/app.css" />
  <style>
    ::view-transition-old(root) { animation: .22s ease both vtOut; }
    ::view-transition-new(root) { animation: .5s cubic-bezier(.22, 1, .36, 1) both vtIn; }
    @keyframes vtOut { to { opacity: 0; } }
    @keyframes vtIn { from { opacity: 0; transform: translateY(8px); } }
  </style>
  <script>try { const t = localStorage.getItem("pitchside.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="root"></div>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/body.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
